    <div class="container">
        <div class="pb-2 mt-4 mb-2 border-bottom">
            <h3 id="restrict-card-title">
                <span key="title#1">Configurações</span>
                <small class="text-muted" key="title#2">Dispositivo (Área Restrita)</small>
            </h3>
        </div>

        <div class="card bg-light" id="connected-wifi-data">
            <div class="card-body">
                <form>
                    <div class="form-floating mb-3">
                        <div class="mb-3" id="positivepercentage">
                            <label for="positive_percentage" class="form-label" key="positive_percentage">Percentual de positivação de Amostras</label>
                            <input type="text" class="form-control" id="positive_percentage">
                        </div>
                    </div>
                </form>
            </div>
            <div class="card-footer">
                <div class="d-grid gap-2" id="save_positive_percentage">
                    <button type="button" class="btn btn-primary" id="btnSalvar">Salvar
                    </button>
                </div>
            </div>
        </div>
    </div>
    <div id="restrict_messages">
        <input type="hidden" id="restart_toast_title" name="restart_toast_title" key="restart_toast_title"
            value="Reiniciar Dispositivo">
        <input type="hidden" id="restart_toast_message" name="restart_toast_message" key="restart_toast_message"
            value="O dispositivo será reiniciado em 10 segundos!">
        <input type="hidden" id="save_success_toast_title" name="save_success_toast_title"
            key="save_success_toast_title" value="Configurações do dispositivo">
        <input type="hidden" id="save_success_toast_message" name="save_success_toast_message"
            key="save_success_toast_message"
            value="A alteração do Número de série do equipamento requer que o dispositivo seja reiniciado.<br />O dispositivo será reiniciado automaticamente em 10 segundos!">
        <input type="hidden" id="save_error_toast_title" name="save_error_toast_title" key="save_error_toast_title"
            value="Configurações do dispositivo">
        <input type="hidden" id="save_error_toast_message" name="save_error_toast_message"
            key="save_error_toast_message" value="Erro ao salvar os dados. Tente novamente!">
    </div>

    <script src="../../bootstrap/js/bootstrap-toaster.min.js"></script>

    <script type="text/javascript">
        $.get("/api/v1/language", function (data) {
            console.log(JSON.stringify(data));

            setLanguage(data.language);
        });

        $(function () {

            Toast.setMaxCount(10);
            Toast.enableQueue(true);

            $(".restart").on("click", function (e) {
                e.preventDefault();

                $.ajax({
                    url: '/api/v1/device/restart',
                    type: "GET",
                    success: function () {
                        let toast = {
                            title: $("#restart_toast_title").val(),
                            message: $("#restart_toast_message").val(),
                            status: TOAST_STATUS.SUCCESS,
                            timeout: 10000
                        }

                        Toast.enableTimers(TOAST_TIMERS.COUNTDOWN);
                        Toast.setTheme(TOAST_THEME.LIGHT);
                        Toast.create(toast);
                    }
                });
            });

            $.get("/api/v1/settings", function (data) {
                console.log(JSON.stringify(data));

                var pp = parseFloat(data.positivePercentage).toFixed(1);

                $("#positive_percentage").val(pp);
            });

            $("#btnSalvar").on('click', function (e) {
                e.preventDefault();

                var percentual = $("#positive_percentage").val();
                
                var pp = (parseFloat(percentual)).toFixed(1);

                var data = {
                    "positivePercentage": pp
                };

                console.log(data);

                $.ajax({
                    url: '/api/v1/restrict/settings',
                    type: "POST",
                    data: JSON.stringify(data),
                    dataType: "json",
                    contentType: "application/json;charset=utf-8",
                    success: function () {
                        let toast = {
                            title: $("#save_success_toast_title").val(),
                            message: $("#save_success_toast_message").val(),
                            status: TOAST_STATUS.SUCCESS,
                            timeout: 10000
                        }

                        Toast.setTheme(TOAST_THEME.LIGHT);
                        Toast.create(toast);
                    },
                    error: function (e) {
                        console.log(e);
                        let toast = {
                            title: $("#save_error_toast_title").val(),
                            message: $("#save_error_toast_message").val(),
                            status: TOAST_STATUS.DANGER,
                            timeout: 10000
                        }

                        Toast.setTheme(TOAST_THEME.LIGHT);
                        Toast.create(toast);
                    }
                });
            });
        });
    </script>
